services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    user: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: my-fastapi-blogicum
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./images:/app/images
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    build:
      context: .
    pull_policy: build
    entrypoint: ./entrypoint.sh
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
